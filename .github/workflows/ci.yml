name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Тесты и сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, sqlite3, pdo_sqlite, intl, zip
          coverage: none

      - name: Кеш зависимостей composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Окружение
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Сборка фронтенда
        run: npm run build

      - name: Стиль кода
        run: ./vendor/bin/pint --test

      - name: Тесты
        run: php artisan test
